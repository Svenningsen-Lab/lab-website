- title: "Dr. Sarah Svenningsen"
  subtitle: "Principal Investigator"
  image: images/team/ssvenningsen.jpg
  image-alt: "Portrait of Dr. Sarah Svenningsen."
  description: "Dr. Svenningsen is an Assistant Professor of Medicine at McMaster University, an Affiliate Scientist at the Research Institute of St. Joe's Hamilton, and a Tier 2 Canada Research Chair (CRC) in Pulmonary Imaging. Her research is focused on the development and clinical study of non-invasive pulmonary computed tomography (CT) and magnetic resonance imaging (MRI) measurements that are highly sensitive to pathological changes in the airways and lung parenchyma. To improve pulmonary disease outcomes, Dr. Svenningsen’s research program focuses on three translational themes using an integrated clinical and medical imaging approach: translational imaging to (1) detect and understand the early manifestation of pulmonary diseases, (2) predict and evaluate pulmonary disease outcomes, and (3) improve the selection, delivery and efficacy of therapies targeting pulmonary diseases."
